<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silsilah keluarga</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f54">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef1ee;--card:#fbfcfb;--tx:#16221d;--mu:#5b6b64;--bd:#cfd8d3;--ac:#1f6f54;--acbg:#dcefe6;--abt:#fff;--er:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}
h1{font:500 20px Georgia,serif;margin:0}
button{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button.pr{background:var(--ac);border-color:var(--ac);color:var(--abt)}
#sc{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);max-height:62vh}
.card{border:1px solid var(--bd);border-radius:12px;background:var(--card);padding:12px;margin-top:12px}
input{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Silsilah keluarga</h1><div class="row" style="margin:0"><button id="bm">Menu</button><button id="bl">Daftar</button><button id="ba" class="pr">+ Tambah</button></div></header>
<div id="mn" class="row" hidden style="margin:0;padding:8px 14px;border-bottom:1px solid var(--bd)"><button id="bs">Sinkron Google Drive</button><button id="be">Ekspor</button><button id="bi">Impor</button><button id="bd">Gabung ganda</button></div>
<input id="backupFile" type="file" accept=".json" hidden>
<main id="app"></main>
<script>
const KEY='silsilah-v1',$=i=>document.getElementById(i),app=$('app');
const GOOGLE_URL='https://script.google.com/macros/s/AKfycbzAf8TPFVb9JGzHUrm6al1jsheD3LZVjrLGpULhgfFQC5hrYXMR3ef3Z9ifONIr9uaN_g/exec';
let P=[],C=null,view='tree',edit=null,Z=1,AD=2,DD=2;
const okId=x=>typeof x==='string'&&/^[\w-]{1,64}$/.test(x),okD=x=>typeof x==='string'&&/^\d{4}(-\d{2}-\d{2})?$/.test(x);
function clean(a){if(!Array.isArray(a))return[];const seen=new Set(),out=[];a.forEach(p=>{if(!p||typeof p!=='object'||!okId(p.id)||typeof p.name!=='string'||!p.name.trim()||seen.has(p.id))return;seen.add(p.id);const r={id:p.id,name:p.name.slice(0,120),fatherId:okId(p.fatherId)?p.fatherId:'',motherId:okId(p.motherId)?p.motherId:'',birth:okD(p.birth)?p.birth:'',death:okD(p.death)?p.death:'',deleted:p.deleted===true,updated:Number.isFinite(p.updated)?p.updated:0,spouseIds:Array.isArray(p.spouseIds)?p.spouseIds.filter(okId):[]};if(p.sx==='L'||p.sx==='P')r.sx=p.sx;out.push(r)});return out}
let RAW='[]';try{RAW=localStorage.getItem(KEY)||'[]'}catch(e){}try{const j=JSON.parse(RAW);P=clean(j)}catch(e){P=[]}
const tick=()=>Date.now();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));return true}catch(e){return false}};const live=()=>P.filter(p=>!p.deleted),by=id=>live().find(p=>p.id===id);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const yr=d=>d?d.slice(0,4):'';const span=p=>{const b=yr(p.birth),d=yr(p.death);return d?(b||'?')+' – '+d:b};const fmt=d=>d?d.split('-').reverse().join('-'):'-';const pd=s=>{s=s.trim();if(!s)return'';const a=s.split(/[\s\-\/.,]+/).filter(Boolean).map(Number);if(a.length===1&&a[0]>=1000)return String(a[0]);if(a.length!==3)return null;const[d,m,y]=a;if(y<1000||m<1||m>12||d<1||d>31)return null;return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')};const short=n=>n.length>13?n.slice(0,12)+'…':n;const cmp=(a,b)=>(a.birth||'9999').localeCompare(b.birth||'9999');const kids=id=>live().filter(p=>p.fatherId===id||p.motherId===id).sort(cmp);const sibs=p=>live().filter(q=>q.id!==p.id&&((p.fatherId&&q.fatherId===p.fatherId)||(p.motherId&&q.motherId===p.motherId)));const spouses=p=>live().filter(q=>q.id!==p.id&&((q.spouseIds||[]).includes(p.id)||(p.spouseIds||[]).includes(q.id)));function setSp(p,ids){ids=[...new Set(ids)].filter(i=>i!==p.id);spouses(p).forEach(q=>{if(!ids.includes(q.id)){q.spouseIds=(q.spouseIds||[]).filter(x=>x!==p.id)}});ids.forEach(i=>{const q=P.find(x=>x.id===i);if(q&&!(q.spouseIds||[]).includes(p.id)){q.spouseIds=[...(q.spouseIds||[]),p.id]}});p.spouseIds=ids}
$('bl').onclick=()=>{view=view==='tree'?'list':'tree';render()};$('bs').onclick=()=>{view='sync';render()};$('bm').onclick=()=>{$('mn').hidden=!$('mn').hidden};$('bd').onclick=()=>{view='dup';render()};$('mn').addEventListener('click',()=>{$('mn').hidden=true});$('ba').onclick=()=>{edit=null;view='form';render()};
function render(){try{if(view==='form')form();else if(view==='list')list();else if(view==='sync')syncView();else if(view==='dup')dupView();else tree();}catch(e){app.innerHTML='<div class="card">Error: '+esc(e.message)+'</div>'}}
function tree(){const c=by(C)||live().sort(cmp)[0];if(!c){app.innerHTML='<div class="card">Belum ada data. Tambah orang pertama atau Menu > Sinkron Google Drive untuk ambil dari Drive.</div>';return} C=c.id; const ch=kids(c.id); const f=by(c.fatherId),m=by(c.motherId); app.innerHTML=`<div class="card"><h2>${esc(c.name)}</h2><div class="mu">Lahir: ${esc(fmt(c.birth))}</div><div class="mu">Ayah: ${f?esc(f.name):'-'} Ibu: ${m?esc(m.name):'-'} Anak: ${ch.length}</div><div class="row"><button id="ed">Sunting</button></div></div><div id="sc" class="card" style="max-height:none">Pohon disederhanakan. Gunakan Daftar untuk cari.</div>`; $('ed').onclick=()=>{edit=c.id;view='form';render()}}
function list(){app.innerHTML='<input id="q" placeholder="Cari nama…"><div id="ls"></div>';const draw=()=>{const t=$('q').value.toLowerCase(),a=live().filter(p=>p.name.toLowerCase().includes(t)).sort((x,y)=>x.name.localeCompare(y.name));$('ls').innerHTML=a.length?a.map(p=>`<div class="li" data-id="${esc(p.id)}"><span>${esc(p.name)}</span><span class="mu">${esc(span(p))}</span></div>`).join(''):'<p class="mu">Tidak ada</p>';$('ls').querySelectorAll('.li').forEach(r=>r.onclick=()=>{C=r.dataset.id;view='tree';render()})};$('q').oninput=draw;draw()}
function form(){const p=(edit&&P.find(x=>x.id===edit))||{name:'',fatherId:'',motherId:'',birth:'',death:''};const L=live().filter(x=>x.id!==p.id);app.innerHTML=`<div class="card"><h2>${edit?'Sunting':'Tambah'}</h2><label>Nama</label><input id="fn" value="${esc(p.name)}"><label>Ayah</label><input id="ff" value="${esc((by(p.fatherId)||{}).name||'')}"><label>Ibu</label><input id="fm" value="${esc((by(p.motherId)||{}).name||'')}"><label>Lahir</label><input id="fb" value="${esc(fmt(p.birth))}"><div class="row"><button class="pr" id="fs">Simpan</button><button id="fc">Batal</button></div></div>`;$('fc').onclick=()=>{view='tree';render()};$('fs').onclick=()=>{const name=$('fn').value.trim();if(!name)return;const b=pd($('fb').value);let tp;if(edit){tp=P.find(x=>x.id===edit);tp.name=name;tp.birth=b||''}else{tp={id:uid(),name,birth:b||'',fatherId:'',motherId:'',deleted:false,spouseIds:[]};P.push(tp);C=tp.id}save();view='tree';render();googleSaveSilent()}}
function dupView(){app.innerHTML='<div class="card">Fitur gabung ganda di versi simple belum aktif.</div>'}
function merge(a){a=clean(a);const m=new Map(P.map(p=>[p.id,p]));a.forEach(r=>{const l=m.get(r.id);if(!l||(r.updated||0)>(l.updated||0))m.set(r.id,r)});P=[...m.values()]}
async function googleSaveSilent(){try{await fetch(GOOGLE_URL,{method:'POST',body:JSON.stringify({action:'save',data:JSON.stringify(P)})})}catch(e){}}
async function googleLoad(st){st('Membaca Drive...');try{const r=await fetch(GOOGLE_URL);const j=await r.json();if(!j.data||j.data.length<5){st('Drive kosong');return}let arr=JSON.parse(j.data);if(typeof arr==='string')arr=JSON.parse(arr);arr=clean(arr);st('Ditemukan '+arr.length+' orang. Menggabungkan...');merge(arr);save();st('Selesai '+live().length+' orang.');render()}catch(e){st('Gagal: '+e.message)}}
async function googleSave(st){st('Menyimpan...');try{const r=await fetch(GOOGLE_URL,{method:'POST',body:JSON.stringify({action:'save',data:JSON.stringify(P)})});const j=await r.json();st(j.success?'Tersimpan! Versi '+j.version:'Gagal '+JSON.stringify(j))}catch(e){st('Error '+e.message)}}
function syncView(){app.innerHTML=`<div class="card"><h2>Sinkron Google Drive</h2><div class="mu">Folder ID 1bpNwsRVr4_MdvSt2Zk9SSukymSENIpcB</div><div class="row"><button class="pr" id="sg">🔄 Ambil dari Drive</button><button id="sp">💾 Simpan ke Drive</button></div><div class="mu" id="ss" style="margin-top:10px">Siap.</div><div class="row"><button id="sl">Kembali</button></div></div>`;const st=t=>{$('ss').textContent=t};$('sg').onclick=()=>googleLoad(st);$('sp').onclick=()=>googleSave(st);$('sl').onclick=()=>{view='tree';render()};googleLoad(st)}
if(live().length===0){fetch(GOOGLE_URL).then(r=>r.json()).then(j=>{if(j.data){try{let a=JSON.parse(j.data);if(typeof a==='string')a=JSON.parse(a);a=clean(a);if(a.length){merge(a);save();render()}}catch(e){}}}).catch(()=>{})}
render();
</script>
</body>
</html>
